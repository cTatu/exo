name: Release

# Publishes run-exo.sh as a downloadable GitHub release asset.
# Trigger: push a version tag, e.g. git tag v0.1.0 && git push origin v0.1.0

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV
            if [[ "${GITHUB_REF_NAME#v}" == *-* ]]; then
              echo "IS_PRERELEASE=true" >> $GITHUB_ENV
            else
              echo "IS_PRERELEASE=false" >> $GITHUB_ENV
            fi
          else
            echo "RELEASE_VERSION=0.0.0-dev.${GITHUB_SHA::7}" >> $GITHUB_ENV
            echo "IS_PRERELEASE=true" >> $GITHUB_ENV
          fi

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            gh release create "$GITHUB_REF_NAME" \
              run-exo.sh \
              --title "EXO ${RELEASE_VERSION}" \
              --generate-notes \
              --prerelease
          else
            gh release create "$GITHUB_REF_NAME" \
              run-exo.sh \
              --title "EXO ${RELEASE_VERSION}" \
              --generate-notes
          fi
